# Builds the Home Assistant add-on image when `version` in code/config.yaml changes on main.
# Home Assistant pulls ghcr.io/bertvanbaelen/travelsteps-{arch}:<version> and offers the update
# (or installs it automatically when "Auto update" is on for the add-on).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bertvanbaelen/travelsteps

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.exists.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]]+).*/\1/p" code/config.yaml)
          app=$(sed -nE "s/.*APP_VERSION = '([^']+)'.*/\1/p" code/server/src/version.ts)
          if [ "$version" != "$app" ]; then
            echo "::error::config.yaml ($version) and version.ts ($app) differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: exists
        # Only build when this version has not been published yet.
        run: |
          if docker manifest inspect "$IMAGE-amd64:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Version ${{ steps.version.outputs.version }} already published; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: code
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}-${{ matrix.arch }}:${{ needs.check.outputs.version }}
            ${{ env.IMAGE }}-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=TravelSteps
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "TravelSteps ${{ needs.check.outputs.version }}" \
            --generate-notes
